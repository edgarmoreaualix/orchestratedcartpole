name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
      - name: install dev deps (skip mjlab/torch install)
        run: uv sync --no-install-project --only-group dev
      - run: uv run ruff check src tests
