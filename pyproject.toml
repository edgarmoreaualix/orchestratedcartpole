[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "cartpole"
version = "0.1.0"
description = "Multi-agent build of a PPO cartpole policy on the mjlab simulator."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab",
  "torch<2.11.0",
  "numpy>=1.26",
  "tyro>=0.9",
  "scipy>=1.15.3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "731fa27" }

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
